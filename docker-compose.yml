
version: '3.8'

services:
  postgres-db:
    image: postgres:14-alpine 
    container_name: chatbot_postgres_db
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: chatbot_db
      
    ports:
      - "5434:5432"
      
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      
    restart: always
